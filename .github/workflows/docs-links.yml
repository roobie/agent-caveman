name: docs-links

on:
  pull_request:
    paths:
      - "**/README.md"
      - INSTALL.md
      - SECURITY.md
      - LICENSING.md
      - docs/technical/**
      - .github/scripts/check-doc-links.mjs
      - .github/workflows/docs-links.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: |
          mapfile -t files < <(git ls-files '*README.md' INSTALL.md SECURITY.md LICENSING.md 'docs/technical/*.md')
          node .github/scripts/check-doc-links.mjs "${files[@]}"
