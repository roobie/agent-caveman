# Weekly, grouped version updates: one PR per ecosystem. Dependabot SECURITY
# updates are a repository setting (Settings -> Code security), not this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /
      - /extension
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  # Pinned tool and CI requirement files.
  - package-ecosystem: pip
    directories:
      - /.github/requirements
      - /benchmarks
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns: ["*"]
